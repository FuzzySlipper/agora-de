<!doctype html>
<html>
<head>
  <title>agora-de shell status</title>
  <meta name="color-scheme" content="light">
  <style>
__AGORA_THEME_CSS__
    button {
      font: inherit;
    }
    button:disabled {
      opacity: 0.55;
    }
    .visually-hidden {
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    .agora-control {
      align-items: center;
      border-radius: var(--agora-radius-control);
      box-sizing: border-box;
      display: inline-flex;
      font: var(--agora-font-body);
      height: var(--agora-control-height);
      justify-content: center;
      line-height: var(--agora-line-height-tight);
      padding: 0 var(--agora-space-3);
      transition: border-color var(--agora-duration) var(--agora-ease),
        background var(--agora-duration) var(--agora-ease),
        color var(--agora-duration) var(--agora-ease);
    }
    .agora-control:disabled {
      opacity: 0.55;
    }
    .chip,
    .badge {
      align-items: center;
      background: var(--agora-surface-strong);
      border-radius: var(--agora-radius-control);
      color: var(--agora-fg);
      display: inline-flex;
      font: var(--agora-font-caption);
      gap: var(--agora-space-2);
      height: var(--agora-control-height);
      justify-content: center;
      line-height: var(--agora-line-height-tight);
      padding: 0 var(--agora-space-4);
    }
    .surface,
    .card {
      background: var(--agora-surface);
      border: 2px solid var(--agora-border-subtle);
      border-radius: var(--agora-radius-control);
      box-shadow: var(--agora-elevation-1);
      box-sizing: border-box;
      font: var(--agora-font-body);
      line-height: var(--agora-line-height-normal);
    }
    .agora-popup {
      background: var(--agora-surface-raised);
      border: 2px solid var(--agora-border);
      border-radius: var(--agora-radius-control);
      box-shadow: var(--agora-elevation-3);
      box-sizing: border-box;
    }
    html,
    body {
      background: var(--agora-bg);
      color: var(--agora-fg);
      font: var(--agora-font-status);
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }
    body {
      box-sizing: border-box;
      display: grid;
      gap: 24px;
      grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      padding: 32px;
    }
    header,
    section {
      max-width: 1120px;
      min-height: 0;
      width: 100%;
    }
    header {
      align-items: center;
      display: flex;
      gap: 18px;
    }
    h1,
    h2 {
      font-size: 20px;
      line-height: 1.2;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    .mark {
      background: var(--agora-evidence-accent);
      border-radius: var(--agora-radius-control);
      height: 36px;
      width: 36px;
    }
    .overall {
      color: var(--agora-text-muted);
      margin-left: auto;
      padding: 0 2px;
      text-align: right;
    }
    .overall.ok {
      color: var(--agora-accent);
    }
    .overall.warn {
      color: var(--agora-warning);
    }
    .close {
      background: var(--agora-surface-raised);
      border: 2px solid var(--agora-border);
      border-radius: var(--agora-radius-control);
      color: var(--agora-fg);
      cursor: pointer;
      font: inherit;
      height: var(--agora-control-height);
      min-width: 76px;
      padding: 0 14px;
    }
    .close:hover,
    .close:focus-visible {
      border-color: var(--agora-accent);
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th,
    td {
      border-bottom: 1px solid var(--agora-border-subtle);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--agora-text-muted);
      font-size: 13px;
      text-transform: uppercase;
    }
    code {
      background: var(--agora-surface-raised);
      border: 1px solid var(--agora-border-subtle);
      border-radius: var(--agora-radius-control);
      display: block;
      font: var(--agora-font-code);
      margin: 8px 0;
      overflow-wrap: anywhere;
      padding: 10px;
    }
    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      overflow: hidden;
    }
    .grid > section,
    section[aria-label="Recovery"] {
      overflow: auto;
    }
    .muted {
      color: var(--agora-text-muted);
    }
  </style>
</head>
<body data-surface="operator">
  <header>
    <span class="mark"></span>
    <h1>agora-de shell status</h1>
    <span class="overall warn" id="overall">status: loading</span>
    <button class="close" id="close-button" type="button">OK</button>
  </header>
  <section class="grid" aria-label="Status summaries">
    <section>
      <h2>Services</h2>
      <table>
        <thead><tr><th>Name</th><th>Scope</th><th>State</th></tr></thead>
        <tbody id="services"><tr><td colspan="3">loading</td></tr></tbody>
      </table>
    </section>
    <section>
      <h2>Sockets</h2>
      <table>
        <thead><tr><th>Path</th><th>State</th></tr></thead>
        <tbody id="sockets"><tr><td colspan="2">loading</td></tr></tbody>
      </table>
    </section>
  </section>
  <section class="grid" aria-label="Compositor summaries">
    <section>
      <h2>Outputs</h2>
      <table>
        <thead><tr><th>Name</th><th>State</th><th>Mode</th><th>Size</th></tr></thead>
        <tbody id="outputs"><tr><td colspan="4">loading</td></tr></tbody>
      </table>
    </section>
    <section>
      <h2>Surfaces</h2>
      <table>
        <tbody id="surfaces"><tr><td>loading</td></tr></tbody>
      </table>
    </section>
  </section>
  <section aria-label="Recovery">
    <h2>Recovery</h2>
    <div id="recovery"><code>loading</code></div>
  </section>
  <script>
    (()=>{
    const endpoint="/api/settings/modules/appearance/load";
    const evidenceTokens=new Set(["--agora-evidence-bg","--agora-evidence-accent","--agora-evidence-strong"]);
    let previewing=false;let revision=null;let requestPending=false;
    function themeFromState(state){if(!state||!state.active||!Array.isArray(state.themes))return null;return state.themes.find((theme)=>theme&&theme.id===state.active.themeId)||null;}
    function applyTokens(tokens){if(!tokens||typeof tokens!=="object")return false;let applied=false;Object.entries(tokens).forEach(([name,value])=>{if(name.startsWith("--agora-")&&!evidenceTokens.has(name)&&typeof value==="string"){document.documentElement.style.setProperty(name,value);applied=true;}});return applied;}
    function applyState(state,force){if(previewing&&!force)return false;const selected=themeFromState(state);if(!selected||!applyTokens(selected.tokens))return false;revision=state.revision;document.documentElement.dataset.agoraTheme=selected.id;return true;}
    async function refresh(){if(requestPending||previewing)return;requestPending=true;try{const response=await fetch(endpoint,{cache:"no-store"});if(!response.ok)return;const state=await response.json();if(state.revision!==revision)applyState(state,false);}catch(_error){}finally{requestPending=false;}}
    let channel=null;try{channel=new BroadcastChannel("agora-de-theme");channel.addEventListener("message",()=>{void refresh();});}catch(_error){}
    const api=Object.freeze({
      applyState:(state)=>applyState(state,true),
      preview:(theme)=>{previewing=true;return Boolean(theme&&applyTokens(theme.tokens));},
      endPreview:(state)=>{previewing=false;if(state)applyState(state,true);else void refresh();},
      notifyApplied:(state)=>{previewing=false;applyState(state,true);if(channel)channel.postMessage({type:"theme-changed",revision:state&&state.revision});},
      refresh,
    });
    window.agoraTheme=api;void refresh();window.setInterval(refresh,1500);
  })();
    function cell(value) {
      const td = document.createElement("td");
      td.textContent = String(value || "");
      return td;
    }

    function renderRows(id, values, mapper, columns) {
      const body = document.getElementById(id);
      body.replaceChildren();
      if (!Array.isArray(values) || values.length === 0) {
        const row = document.createElement("tr");
        const empty = cell("none");
        empty.colSpan = columns;
        row.appendChild(empty);
        body.appendChild(row);
        return;
      }
      values.forEach((value) => body.appendChild(mapper(value)));
    }

    function row(...values) {
      const tr = document.createElement("tr");
      values.forEach((value) => tr.appendChild(cell(value)));
      return tr;
    }

    function renderCommands(target, title, commands) {
      if (!Array.isArray(commands) || commands.length === 0) {
        return;
      }
      const label = document.createElement("div");
      label.className = "muted";
      label.textContent = title;
      target.appendChild(label);
      commands.forEach((command) => {
        const code = document.createElement("code");
        code.textContent = command;
        target.appendChild(code);
      });
    }

    async function refresh() {
      const response = await fetch("/api/operator/status", {cache: "no-store"});
      if (!response.ok) {
        throw new Error("operator status returned " + response.status);
      }
      const status = await response.json();
      const overall = document.getElementById("overall");
      overall.textContent = "status: " + (status.overall || "unknown");
      overall.className = "overall " + (status.overall === "ok" ? "ok" : "warn");

      renderRows("services", status.services, (service) => row(service.name, service.scope, service.state), 3);
      renderRows("sockets", status.sockets, (socket) => row(socket.path, socket.state), 2);
      renderRows("outputs", status.outputs, (output) => {
        const size = output.width && output.height ? output.width + "x" + output.height : output.detail || "";
        return row(output.name, output.state, output.mode || "", size);
      }, 4);

      const surfaces = status.surfaces || {};
      const surfaceBody = document.getElementById("surfaces");
      surfaceBody.replaceChildren(
        row("state", surfaces.state || "unknown"),
        row("total", surfaces.total || 0),
        row("layer shell", surfaces.layerShell || 0),
        row("work", surfaces.work || 0),
        row("focused", surfaces.focused || 0)
      );

      const recovery = status.recovery || {};
      const recoveryTarget = document.getElementById("recovery");
      recoveryTarget.replaceChildren();
      renderCommands(recoveryTarget, "Kill all", [recovery.killAllCommand].filter(Boolean));
      renderCommands(recoveryTarget, "Restart", recovery.restartCommands);
      renderCommands(recoveryTarget, "Live checks", recovery.liveCheckCommands);
      if (recovery.runbook) {
        const runbook = document.createElement("code");
        runbook.textContent = recovery.runbook;
        recoveryTarget.appendChild(runbook);
      }
      if (recovery.note) {
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = recovery.note;
        recoveryTarget.appendChild(note);
      }
    }

    async function postJSON(path, body) {
      const response = await fetch(path, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        throw new Error(path + " returned " + response.status);
      }
      return response.json();
    }

    async function closeStatus() {
      try {
        const response = await fetch("/api/surfaces", {cache: "no-store"});
        if (!response.ok) {
          throw new Error("surfaces returned " + response.status);
        }
        const payload = await response.json();
        const surfaces = Array.isArray(payload.surfaces) ? payload.surfaces : [];
        const surface = surfaces.find((candidate) =>
          candidate.mapped && candidate.appId === "io.agorade.ShellStatus"
        ) || surfaces.find((candidate) => candidate.appId === "io.agorade.ShellStatus");
        if (surface && surface.id) {
          await postJSON("/api/surfaces/action", {surfaceId: surface.id, action: "close"});
          return;
        }
      } catch (error) {
        document.getElementById("overall").textContent = "status: close failed";
        document.getElementById("overall").className = "overall warn";
      }
      window.close();
    }

    document.getElementById("close-button").addEventListener("click", closeStatus);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeStatus();
      }
    });
    window.addEventListener("focus", () => refresh().catch(() => {}));
    refresh().catch((error) => {
      document.getElementById("overall").textContent = "status: offline";
      document.getElementById("overall").className = "overall warn";
    });
    setInterval(refresh, 5000);
  </script>
</body>
</html>
