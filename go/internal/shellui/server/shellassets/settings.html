<!doctype html>
<html>
<head>
  <title>Agora Settings</title>
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
__AGORA_THEME_CSS__
    * { box-sizing: border-box; }
    html, body { background: var(--agora-bg); color: var(--agora-fg); font: var(--agora-font-body); height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; overflow: hidden; }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--agora-accent); outline-offset: 2px; }
    .visually-hidden { height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; clip: rect(0 0 0 0); white-space: nowrap; }
    .app-header { align-items: center; border-bottom: 1px solid var(--agora-border-subtle); display: flex; gap: 14px; min-height: 72px; padding: 14px 20px; }
    .mark { background: var(--agora-evidence-accent); border-radius: var(--agora-radius-control); height: 34px; width: 34px; }
    .title-block { min-width: 0; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; }
    .subtitle { color: var(--agora-text-muted); font-size: 13px; margin-top: 3px; }
    .settings-search { background: var(--agora-surface); border: 2px solid var(--agora-border); border-radius: var(--agora-radius-control); color: var(--agora-fg); margin-left: auto; min-height: 42px; min-width: min(340px, 42vw); padding: 0 13px; }
    .settings-layout { display: grid; grid-template-columns: minmax(220px, 29%) minmax(0, 1fr); min-height: 0; }
    .sidebar { background: var(--agora-surface); border-right: 1px solid var(--agora-border-subtle); min-height: 0; overflow-y: auto; padding: 14px; }
    .category { margin-bottom: 18px; }
    .category-title { color: var(--agora-text-muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; margin: 4px 8px 8px; text-transform: uppercase; }
    .module-button { background: transparent; border: 1px solid transparent; border-radius: var(--agora-radius-control); color: var(--agora-fg); cursor: pointer; display: grid; gap: 3px; min-height: 58px; padding: 9px 10px; text-align: left; width: 100%; }
    .module-button:hover { background: var(--agora-surface-raised); }
    .module-button[aria-current="page"] { background: var(--agora-surface-raised); border-color: var(--agora-accent); }
    .module-button-title { font-weight: 800; }
    .module-button-summary { color: var(--agora-text-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .module-button-state { color: var(--agora-warning); font-size: 11px; }
    .content { min-height: 0; overflow-y: auto; padding: clamp(18px, 4vw, 38px); }
    .content-header { border-bottom: 1px solid var(--agora-border-subtle); margin-bottom: 22px; padding-bottom: 16px; }
    .content-title { font-size: 24px; }
    .content-summary { color: var(--agora-text-muted); margin-top: 7px; max-width: 70ch; }
    .module-content { display: grid; gap: 14px; }
    .settings-module-panel { display: grid; gap: 14px; }
    .setting-row { align-items: center; background: var(--agora-surface); border: 1px solid var(--agora-border); border-radius: var(--agora-radius-control); display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) auto; min-height: 92px; padding: 16px 18px; }
    .setting-copy { display: grid; gap: 6px; min-width: 0; }
    .setting-title { font-size: 16px; }
    .setting-detail { color: var(--agora-text-muted); font-size: 13px; }
    .toggle { align-items: center; background: var(--agora-surface-raised); border: 2px solid var(--agora-border); border-radius: 999px; color: var(--agora-fg); cursor: pointer; display: inline-flex; height: 38px; justify-content: flex-start; min-width: 76px; padding: 0 5px; }
    .toggle::before { background: var(--agora-text-muted); border-radius: 50%; content: ""; height: 24px; transition: transform var(--agora-duration) var(--agora-ease), background var(--agora-duration) var(--agora-ease); width: 24px; }
    .toggle[aria-pressed="true"] { border-color: var(--agora-accent); }
    .toggle[aria-pressed="true"]::before { background: var(--agora-accent); transform: translateX(36px); }
    .empty, .module-error { background: var(--agora-surface); border: 1px solid var(--agora-border); border-radius: var(--agora-radius-control); color: var(--agora-text-muted); padding: 20px; }
    .module-error { border-color: var(--agora-warning); color: var(--agora-fg); }
    .error-title { color: var(--agora-warning); font-weight: 800; }
    .error-detail { margin-top: 6px; }
    .validation-list { color: var(--agora-warning); margin: 10px 0 0; padding-left: 22px; }
    .app-footer { align-items: center; border-top: 1px solid var(--agora-border-subtle); display: flex; gap: 10px; min-height: 66px; padding: 12px 20px; }
    .status { color: var(--agora-text-muted); margin-right: auto; }
    .dirty-indicator { color: var(--agora-warning); font-weight: 800; }
    .action { background: var(--agora-surface-raised); border: 2px solid var(--agora-border); border-radius: var(--agora-radius-control); color: var(--agora-fg); cursor: pointer; min-height: 40px; padding: 0 15px; }
    .action.primary { background: var(--agora-accent); border-color: var(--agora-accent); color: var(--agora-surface-strong); font-weight: 800; }
    .action:disabled, .toggle:disabled { cursor: default; opacity: .5; }
    @media (max-width: 720px) {
      .app-header { align-items: stretch; flex-wrap: wrap; }
      .settings-search { flex-basis: 100%; margin-left: 0; min-width: 0; width: 100%; }
      .settings-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .sidebar { border-bottom: 1px solid var(--agora-border-subtle); border-right: 0; display: flex; gap: 8px; max-height: 150px; overflow: auto; }
      .category { display: flex; flex: 0 0 auto; gap: 6px; margin: 0; }
      .category-title { align-self: center; margin: 0 4px; }
      .module-button { min-width: 190px; }
      .content { padding: 18px; }
      .app-footer { flex-wrap: wrap; }
      .status { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body data-surface="settings">
  <header class="app-header">
    <span class="mark" aria-hidden="true"></span>
    <div class="title-block"><h1>Settings</h1><p class="subtitle">Configure your Agora desktop</p></div>
    <label for="settings-search" class="visually-hidden">Search settings</label>
    <input class="settings-search" id="settings-search" type="search" placeholder="Search settings" autocomplete="off">
  </header>
  <div class="settings-layout">
    <nav class="sidebar" id="settings-navigation" aria-label="Settings categories"></nav>
    <main class="content" id="settings-content" tabindex="-1">
      <header class="content-header"><h2 class="content-title" id="module-title">Settings</h2><p class="content-summary" id="module-summary">Loading modules…</p></header>
      <section class="module-content" id="module-content" aria-live="polite"></section>
    </main>
  </div>
  <footer class="app-footer">
    <span class="status" id="settings-status" role="status">Loading settings…</span>
    <span class="dirty-indicator" id="dirty-indicator" hidden>Unsaved changes</span>
    <button class="action" id="defaults-button" type="button" disabled>Restore Defaults</button>
    <button class="action" id="reset-button" type="button" disabled>Reset</button>
    <button class="action primary" id="apply-button" type="button" disabled>Apply</button>
  </footer>
  <template data-settings-entry="settings-displays">
    <style>
      .display-status { background: var(--agora-surface); border: 1px solid var(--agora-border); border-radius: var(--agora-radius-control); color: var(--agora-text-muted); padding: 12px 14px; }
      .display-confirm { background: color-mix(in srgb, var(--agora-warning) 13%, var(--agora-surface)); border: 2px solid var(--agora-warning); border-radius: var(--agora-radius-control); display: grid; gap: 10px; padding: 16px; }
      .display-confirm[hidden] { display: none; }
      .display-confirm-actions { display: flex; flex-wrap: wrap; gap: 9px; }
      .display-arrangement { background: var(--agora-surface); border: 1px solid var(--agora-border); border-radius: var(--agora-radius-control); min-height: 230px; overflow: hidden; position: relative; }
      .display-tile { background: var(--agora-surface-raised); border: 2px solid var(--agora-border); border-radius: 8px; color: var(--agora-fg); cursor: grab; min-height: 54px; min-width: 90px; overflow: hidden; padding: 8px; position: absolute; text-align: left; touch-action: none; }
      .display-tile[aria-pressed="true"] { border-color: var(--agora-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--agora-accent) 24%, transparent); }
      .display-tile:disabled { cursor: default; opacity: .55; }
      .display-grid { display: grid; gap: 14px; }
      .display-card { background: var(--agora-surface); border: 1px solid var(--agora-border); border-radius: var(--agora-radius-control); display: grid; gap: 14px; padding: 16px; }
      .display-card[aria-current="true"] { border-color: var(--agora-accent); }
      .display-card-header { align-items: start; display: flex; gap: 12px; justify-content: space-between; }
      .display-card-title { display: grid; gap: 4px; }
      .display-fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .display-field { color: var(--agora-text-muted); display: grid; font-size: 12px; gap: 6px; }
      .display-field input, .display-field select { background: var(--agora-bg); border: 2px solid var(--agora-border); border-radius: var(--agora-radius-control); color: var(--agora-fg); min-height: 40px; padding: 7px 9px; width: 100%; }
      .display-check { align-items: center; color: var(--agora-fg); display: flex; gap: 8px; }
      .display-check input { height: 20px; width: 20px; }
      @media (max-width: 720px) { .display-arrangement { min-height: 180px; } }
    </style>
    <section class="settings-module-panel" data-settings-module="displays">
      <p class="display-status" id="display-status" role="status">Loading display topology…</p>
      <p class="setting-detail">Primary display selection is not exposed by the supported output-management protocol and is not configurable in this release.</p>
      <section class="display-confirm" id="display-confirm" role="alertdialog" aria-modal="true" aria-labelledby="display-confirm-title" aria-describedby="display-confirm-countdown" hidden>
        <strong id="display-confirm-title">Keep these display settings?</strong>
        <span id="display-confirm-countdown" role="status" aria-live="assertive">The previous configuration will be restored automatically.</span>
        <div class="display-confirm-actions"><button class="action primary" id="display-keep" type="button">Keep</button><button class="action" id="display-revert" type="button">Revert now</button></div>
      </section>
      <div class="display-arrangement" id="display-arrangement" role="group" aria-label="Display arrangement. Select a display, drag it, or use arrow keys to move it."></div>
      <div class="display-grid" id="display-controls"></div>
    </section></template>
<template data-settings-entry="settings-window-management">
    <style>
      .wm-settings-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
      .wm-settings-card { background:var(--agora-surface); border:1px solid var(--agora-border); border-radius:var(--agora-radius-control); display:grid; gap:12px; padding:16px; }
      .wm-settings-card h3 { font-size:16px; }
      .wm-settings-field { color:var(--agora-text-muted); display:grid; font-size:12px; gap:6px; }
      .wm-settings-field input,.wm-settings-field select { background:var(--agora-bg); border:2px solid var(--agora-border); border-radius:var(--agora-radius-control); color:var(--agora-fg); min-height:42px; padding:7px 9px; width:100%; }
      .wm-settings-check { align-items:center; color:var(--agora-fg); display:flex; gap:9px; min-height:42px; }
      .wm-settings-check input { height:20px; width:20px; }
      .wm-workspaces { display:grid; gap:8px; list-style:none; margin:0; padding:0; }
      .wm-workspace { border:1px solid var(--agora-border-subtle); border-radius:var(--agora-radius-control); display:flex; justify-content:space-between; padding:10px 12px; }
    </style>
    <section class="settings-module-panel" data-settings-module="window-management">
      <p class="display-status" id="wm-settings-status" role="status">Loading layout authority…</p>
      <div class="wm-settings-grid">
        <section class="wm-settings-card"><h3>Layout</h3>
          <label class="wm-settings-field">Mode<select data-wm-field="mode"><option value="freeform">Freeform</option><option value="zones">Zones</option><option value="columns">Columns</option></select></label>
          <label class="wm-settings-field">Rule<select data-wm-field="rule"><option value="master_stack">Master and stack</option><option value="dwindle">Dwindle</option><option value="zones">Zones</option></select></label>
          <label class="wm-settings-field">Master windows<input data-wm-field="masterCount" type="number" min="1" max="8" step="1"></label>
          <label class="wm-settings-field">Master ratio (%)<input data-wm-field="masterRatio" type="number" min="10" max="90" step="5"></label>
          <label class="wm-settings-check"><input data-wm-field="smartGaps" type="checkbox">Hide outer gaps for one tiled window</label>
        </section>
        <section class="wm-settings-card"><h3>Gaps</h3>
          <label class="wm-settings-field">Outer horizontal<input data-wm-field="gaps.outerHorizontal" type="number" min="0" max="128" step="1"></label>
          <label class="wm-settings-field">Outer vertical<input data-wm-field="gaps.outerVertical" type="number" min="0" max="128" step="1"></label>
          <label class="wm-settings-field">Inner horizontal<input data-wm-field="gaps.innerHorizontal" type="number" min="0" max="128" step="1"></label>
          <label class="wm-settings-field">Inner vertical<input data-wm-field="gaps.innerVertical" type="number" min="0" max="128" step="1"></label>
        </section>
        <section class="wm-settings-card"><h3>Workspaces</h3><p class="setting-detail">Workspace activation stays in the shell; this page shows authoritative layout membership.</p><ul class="wm-workspaces" id="wm-workspaces"></ul></section>
      </div>
    </section></template>
<template data-settings-entry="settings-appearance"><style>
    .appearance-themes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.appearance-theme{background:var(--agora-surface);border:2px solid var(--agora-border);border-radius:var(--agora-radius-control);display:grid;gap:10px;padding:14px}.appearance-theme:has(input:checked){border-color:var(--agora-accent)}.appearance-theme input{height:20px;width:20px}.appearance-swatch{border:1px solid var(--agora-border);display:grid;grid-template-columns:2fr 2fr 1fr;height:54px}.appearance-swatch span{display:block}
  </style><section class="settings-module-panel" data-settings-module="appearance"><p id="appearance-status" role="status">Loading bundled themes…</p><div class="appearance-themes" id="appearance-themes"></div><p class="setting-detail">Preview affects this Settings window. Apply updates open shell surfaces and saves the theme for the next session.</p></section></template>
<template data-settings-entry="settings-shortcuts"><style>
  .shortcut-toolbar{display:flex;gap:10px}.shortcut-toolbar input{background:var(--agora-bg);border:2px solid var(--agora-border);color:var(--agora-fg);min-height:42px;padding:7px 10px;width:min(420px,100%)}.shortcut-groups{display:grid;gap:18px}.shortcut-group{display:grid;gap:8px}.shortcut-row{align-items:center;background:var(--agora-surface);border:1px solid var(--agora-border-subtle);display:grid;gap:10px;grid-template-columns:minmax(160px,1fr) minmax(220px,1fr) auto auto;padding:12px}.shortcut-row input{background:var(--agora-bg);border:2px solid var(--agora-border);color:var(--agora-fg);min-height:42px;padding:7px 9px}.shortcut-row.conflict{border-color:var(--agora-warning)}.shortcut-default{color:var(--agora-text-muted);font-size:12px}.shortcut-error{color:var(--agora-warning);grid-column:1/-1}.shortcut-reserved{font-size:12px}
  @media(max-width:760px){.shortcut-row{grid-template-columns:1fr}.shortcut-error{grid-column:auto}}
  </style><section class="settings-module-panel" data-settings-module="shortcuts"><label class="shortcut-toolbar">Search shortcuts<input id="shortcut-search" type="search" autocomplete="off"></label><p id="shortcut-status" role="status" aria-live="polite">Loading managed bindings…</p><div class="shortcut-groups" id="shortcut-groups"></div></section></template>
<template data-settings-entry="settings-diagnostics">
    <style>.diagnostics-about{display:grid;gap:14px}.diagnostics-health{display:grid;gap:8px}.diagnostics-component{background:var(--agora-surface);border:1px solid var(--agora-border-subtle);display:grid;gap:4px;grid-template-columns:minmax(160px,1fr) auto;padding:11px}.diagnostics-component .setting-detail{grid-column:1/-1}.diagnostics-component[data-state="unavailable"]{border-color:var(--agora-warning)}</style>
    <section class="settings-module-panel" data-settings-module="diagnostics">
      <div class="setting-row">
        <span class="setting-copy">
          <strong class="setting-title">Debug overlay</strong>
          <span class="setting-detail"><span data-settings-text="service.enabledState">loading</span> / <span data-settings-text="service.activeState">loading</span></span>
        </span>
        <button class="toggle" id="overlay-toggle" data-settings-field="diagnosticOverlayEnabled" type="button" aria-label="Debug overlay" aria-pressed="false"></button>
      </div>
      <section class="diagnostics-about"><h3>About</h3><p><strong id="diagnostics-version">Agora DE</strong> · Settings schema <span id="diagnostics-schema">1</span></p><h3>Service health</h3><div class="diagnostics-health" id="diagnostics-health"></div><p id="diagnostics-export-status" role="status" aria-live="polite"></p><button type="button" id="diagnostics-export">Export bounded support bundle</button><p class="setting-detail">Includes only product versions and allowlisted service states. It excludes environment values, window titles, clipboard data, user files, and journal logs.</p></section>
    </section></template>
  <script>
    (()=>{
    const endpoint="/api/settings/modules/appearance/load";
    const evidenceTokens=new Set(["--agora-evidence-bg","--agora-evidence-accent","--agora-evidence-strong"]);
    let previewing=false;let revision=null;let requestPending=false;
    function themeFromState(state){if(!state||!state.active||!Array.isArray(state.themes))return null;return state.themes.find((theme)=>theme&&theme.id===state.active.themeId)||null;}
    function applyTokens(tokens){if(!tokens||typeof tokens!=="object")return false;let applied=false;Object.entries(tokens).forEach(([name,value])=>{if(name.startsWith("--agora-")&&!evidenceTokens.has(name)&&typeof value==="string"){document.documentElement.style.setProperty(name,value);applied=true;}});return applied;}
    function applyState(state,force){if(previewing&&!force)return false;const selected=themeFromState(state);if(!selected||!applyTokens(selected.tokens))return false;revision=state.revision;document.documentElement.dataset.agoraTheme=selected.id;return true;}
    async function refresh(){if(requestPending||previewing)return;requestPending=true;try{const response=await fetch(endpoint,{cache:"no-store"});if(!response.ok)return;const state=await response.json();if(state.revision!==revision)applyState(state,false);}catch(_error){}finally{requestPending=false;}}
    let channel=null;try{channel=new BroadcastChannel("agora-de-theme");channel.addEventListener("message",()=>{void refresh();});}catch(_error){}
    const api=Object.freeze({
      applyState:(state)=>applyState(state,true),
      preview:(theme)=>{previewing=true;return Boolean(theme&&applyTokens(theme.tokens));},
      endPreview:(state)=>{previewing=false;if(state)applyState(state,true);else void refresh();},
      notifyApplied:(state)=>{previewing=false;applyState(state,true);if(channel)channel.postMessage({type:"theme-changed",revision:state&&state.revision});},
      refresh,
    });
    window.agoraTheme=api;void refresh();window.setInterval(refresh,1500);
  })();
    const controllerFactories = Object.freeze({"settings-displays": (api) => {
      const arrangement = api.content.querySelector("#display-arrangement");
      const controls = api.content.querySelector("#display-controls");
      const status = api.content.querySelector("#display-status");
      const confirmation = api.content.querySelector("#display-confirm");
      const countdown = api.content.querySelector("#display-confirm-countdown");
      const keep = api.content.querySelector("#display-keep");
      const revert = api.content.querySelector("#display-revert");
      let selected = "";
      let timer = 0;
      let topologyTimer = 0;
      let polling = false;
      let confirmationBusy = false;
      let confirmationWasOpen = false;
      let confirmationReturnFocus = null;

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      function draft() { return api.getDraft(); }
      function state() { return api.getModuleState(); }
      function head(id) { return draft() && draft().heads.find((candidate) => candidate.id === id); }
      function edit(id, field, value) {
        const target = head(id); if (!target) return;
        target[field] = value; selected = id; api.markDirty();
      }
      function logicalSize(output) {
        const mode = output.modes.find((candidate) => candidate.id === output.currentModeId) || output.modes[0];
        if (!mode) return {width: 800, height: 600};
        const rotated = ["rotate_90", "rotate_270", "flipped_90", "flipped_270"].includes(output.transform);
        return {width: (rotated ? mode.height : mode.width) * 1000 / output.scaleMilli, height: (rotated ? mode.width : mode.height) * 1000 / output.scaleMilli};
      }
      function renderArrangement(outputs) {
        arrangement.replaceChildren();
        const active = outputs.filter((output) => output.connected && output.enabled);
        if (!active.length) return;
        const rects = active.map((output) => ({output, ...logicalSize(output)}));
        const minX = Math.min(...rects.map((rect) => rect.output.x));
        const minY = Math.min(...rects.map((rect) => rect.output.y));
        const maxX = Math.max(...rects.map((rect) => rect.output.x + rect.width));
        const maxY = Math.max(...rects.map((rect) => rect.output.y + rect.height));
        const spanX = Math.max(1, maxX - minX); const spanY = Math.max(1, maxY - minY);
        rects.forEach((rect) => {
          const tile = element("button", "display-tile", rect.output.identity.name || rect.output.id);
          tile.type = "button"; tile.dataset.headId = rect.output.id;
          tile.setAttribute("aria-pressed", String(selected === rect.output.id));
          tile.setAttribute("aria-label", (rect.output.identity.description || rect.output.id) + ". Position " + rect.output.x + ", " + rect.output.y + ". Use arrow keys to move.");
          tile.style.left = (4 + ((rect.output.x - minX) / spanX) * 76) + "%";
          tile.style.top = (6 + ((rect.output.y - minY) / spanY) * 66) + "%";
          tile.style.width = Math.max(90, (rect.width / spanX) * arrangement.clientWidth * .76) + "px";
          tile.style.height = Math.max(54, (rect.height / spanY) * arrangement.clientHeight * .66) + "px";
          tile.addEventListener("click", () => { selected = rect.output.id; render(); api.content.querySelector('[data-display-card="' + CSS.escape(selected) + '"]')?.scrollIntoView({block: "nearest"}); });
          tile.addEventListener("keydown", (event) => {
            const movement = {ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -10], ArrowDown: [0, 10]}[event.key];
            if (!movement) return; event.preventDefault();
            edit(rect.output.id, "x", rect.output.x + movement[0]); edit(rect.output.id, "y", rect.output.y + movement[1]);
          });
          tile.addEventListener("pointerdown", (event) => {

      const entry = selectedEntry(); if (!entry) return;
      state.busy = true; state.error = null; state.notice = ""; renderModuleState();
      try {
        state.moduleState = await requestJSON(operationPath(entry.manifest.id, "load"));
        state.draft = clone(state.moduleState.active); state.dirty = false;
      } catch (error) { renderError(error.settings || {code: "unavailable", message: error.message}, true); return; }
      finally { state.busy = false; }
      renderModuleState();
    }

    async function applyDraft() {
      const entry = selectedEntry(); if (!entry || !state.moduleState || !state.draft || state.busy) return;
      state.busy = true; state.error = null; state.notice = ""; content.querySelector(".validation-list")?.remove(); renderModuleState();
      const request = {contractVersion: entry.manifest.contractVersion, baseRevision: state.moduleState.revision, draft: state.draft};
      try {
        if (state.controller && state.controller.prepareApply) state.controller.prepareApply(request);
        const validation = await postJSON(operationPath(entry.manifest.id, "validate"), request);
        if (!validation.valid) {
          const list = document.createElement("ul"); list.className = "validation-list"; list.setAttribute("role", "alert");
          (validation.issues || []).forEach((issue) => { const item = document.createElement("li"); item.textContent = text(issue.message, "Invalid value"); list.appendChild(item); });
          content.prepend(list); state.error = {code: "validation_failed", message: "Some values need attention."}; return;
        }
        const result = await postJSON(operationPath(entry.manifest.id, "apply"), request);
        state.moduleState = result.state; state.draft = clone(result.state.active); state.dirty = false;
        state.notice = result.outcome && result.outcome.kind === "restart_required" ? "Applied; restart required" : result.outcome && result.outcome.kind === "pending_confirmation" ? "Confirm the new display configuration" : "Changes applied";
        if (state.controller && state.controller.applied) state.controller.applied(result);
      } catch (error) { state.error = error.settings || {code: "apply_failed", message: error.message}; }
      finally { state.busy = false; renderModuleState(); }
    }

    function resetDraft() { if (!state.moduleState || state.busy) return; state.draft = clone(state.moduleState.active); state.dirty = false; state.error = null; state.notice = "Draft reset"; content.querySelector(".validation-list")?.remove(); renderModuleState(); }
    async function restoreDefaults() {
      const entry = selectedEntry(); if (!entry || !state.moduleState || state.busy) return;
      state.busy = true; state.notice = ""; renderModuleState();
      try { state.draft = await postJSON(operationPath(entry.manifest.id, "restore_defaults"), {contractVersion: entry.manifest.contractVersion, baseRevision: state.moduleState.revision}); state.dirty = true; state.error = null; }
      catch (error) { state.error = error.settings || {code: "apply_failed", message: error.message}; }
      finally { state.busy = false; renderModuleState(); }
    }

    async function start() {
      try {
        state.catalog = await requestJSON("/api/settings/catalog"); renderNavigation();
        const requested = new URLSearchParams(location.search).get("module");
        const initial = state.catalog.modules.some((entry) => entry.manifest.id === requested) ? requested : state.catalog.modules[0] && state.catalog.modules[0].manifest.id;
        if (initial) await selectModule(initial, false); else { summary.textContent = "No settings modules are registered."; content.innerHTML = '<p class="empty">No settings modules are available.</p>'; }
      } catch (error) { renderError(error.settings || {code: "unavailable", message: error.message}, true); }
    }

    search.addEventListener("input", renderNavigation);
    navigation.addEventListener("keydown", (event) => { if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return; const buttons = Array.from(navigation.querySelectorAll(".module-button")); const index = buttons.indexOf(document.activeElement); if (index < 0) return; event.preventDefault(); buttons[(index + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length].focus(); });
    document.getElementById("apply-button").addEventListener("click", applyDraft);
    document.getElementById("reset-button").addEventListener("click", resetDraft);
    document.getElementById("defaults-button").addEventListener("click", restoreDefaults);
    window.addEventListener("popstate", () => { const requested = new URLSearchParams(location.search).get("module"); if (requested) selectModule(requested, false); });
    window.addEventListener("focus", () => { if (!state.dirty && !state.busy) loadSelectedModule(); });
    window.addEventListener("beforeunload", (event) => { if (!state.dirty) return; event.preventDefault(); event.returnValue = ""; });
    start();
  </script>
</body>
</html>
