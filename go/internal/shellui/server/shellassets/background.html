<!doctype html>
<html>
<head>
  <title>agora-de shell</title>
  <style>
__AGORA_THEME_CSS__
    button {
      font: inherit;
    }
    button:disabled {
      opacity: 0.55;
    }
    .visually-hidden {
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    .agora-control {
      align-items: center;
      border-radius: var(--agora-radius-control);
      box-sizing: border-box;
      display: inline-flex;
      font: var(--agora-font-body);
      height: var(--agora-control-height);
      justify-content: center;
      line-height: var(--agora-line-height-tight);
      padding: 0 var(--agora-space-3);
      transition: border-color var(--agora-duration) var(--agora-ease),
        background var(--agora-duration) var(--agora-ease),
        color var(--agora-duration) var(--agora-ease);
    }
    .agora-control:disabled {
      opacity: 0.55;
    }
    .chip,
    .badge {
      align-items: center;
      background: var(--agora-surface-strong);
      border-radius: var(--agora-radius-control);
      color: var(--agora-fg);
      display: inline-flex;
      font: var(--agora-font-caption);
      gap: var(--agora-space-2);
      height: var(--agora-control-height);
      justify-content: center;
      line-height: var(--agora-line-height-tight);
      padding: 0 var(--agora-space-4);
    }
    .surface,
    .card {
      background: var(--agora-surface);
      border: 2px solid var(--agora-border-subtle);
      border-radius: var(--agora-radius-control);
      box-shadow: var(--agora-elevation-1);
      box-sizing: border-box;
      font: var(--agora-font-body);
      line-height: var(--agora-line-height-normal);
    }
    .agora-popup {
      background: var(--agora-surface-raised);
      border: 2px solid var(--agora-border);
      border-radius: var(--agora-radius-control);
      box-shadow: var(--agora-elevation-3);
      box-sizing: border-box;
    }
    html,
    body {
      background: var(--agora-bg);
      color: var(--agora-fg);
      font: var(--agora-font-background);
      height: 100%;
      margin: 0;
    }
    body {
      box-sizing: border-box;
      display: grid;
      grid-template-rows: 1fr;
      min-height: 100vh;
    }
    .stage {
      align-items: center;
      display: flex;
      gap: 18px;
      padding: 0 28px;
    }
    .mark {
      background: var(--agora-evidence-accent);
      border-radius: var(--agora-radius-control);
      height: 40px;
      width: 40px;
    }
    .taskbar {
      align-items: center;
      background: var(--agora-surface);
      border-top: 4px solid var(--agora-evidence-accent);
      box-shadow: inset 0 1px 0 var(--agora-border-subtle);
      box-sizing: border-box;
      display: flex;
      gap: 18px;
      min-height: var(--agora-panel-height);
      padding: 0 28px;
    }
    .badge {
      align-items: center;
      background: var(--agora-evidence-strong);
      border-radius: var(--agora-radius-control);
      color: var(--agora-bg);
      display: inline-flex;
      height: var(--agora-control-height);
      justify-content: center;
      min-width: 132px;
      padding: 0 16px;
    }
    .slot {
      align-items: center;
      border: 2px solid var(--agora-border);
      border-radius: var(--agora-radius-control);
      display: inline-flex;
      height: 40px;
      padding: 0 14px;
    }
  </style>
</head>
<body class="background" data-surface="__AGORA_SURFACE__">
  <main class="stage">
    <span class="mark"></span>
    <span>agora-de shell: __AGORA_SURFACE__</span>
  </main>
</body>
</html>
