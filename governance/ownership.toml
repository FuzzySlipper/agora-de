# Machine-readable ownership and dependency policy.

[workspace]
rust_root = "de-rs"
go_root = "go"
ts_root = "ts"

[go_package."go/internal/osboundary"]
lane = "go-boundary"
may_import = []

[go_package."go/internal/wayfireproto"]
lane = "go-compositor-protocol"
may_import = []

[go_package."go/internal/surfacetrack"]
lane = "go-compositor"
may_import = ["go/internal/wayfireproto"]

[go_package."go/internal/compositorbridge"]
lane = "go-compositor"
may_import = []

[go_package."go/internal/launchlife"]
lane = "go-compositor"
may_import = ["go/internal/session"]

[go_package."go/internal/nativelaunch"]
lane = "go-compositor"
may_import = ["go/internal/appcatalog", "go/internal/launchlife", "go/internal/session"]

[go_package."go/internal/capture"]
lane = "go-compositor"
may_import = []

[go_package."go/internal/input"]
lane = "go-compositor"
may_import = []

[go_package."go/internal/policy"]
lane = "go-compositor"
may_import = ["go/internal/input", "go/internal/wayfireproto"]

[go_package."go/internal/session"]
lane = "go-session"
may_import = []

[go_package."go/internal/appcatalog"]
lane = "go-shell"
may_import = []

[go_package."go/internal/shelldefaults"]
lane = "go-shell"
may_import = []

[go_package."go/internal/shellui/staticserve"]
lane = "go-shellui"
may_import = []

[go_package."go/internal/shellui/surfaceactions"]
lane = "go-shellui"
may_import = ["go/internal/wayfireproto"]

[go_package."go/internal/shellui/escalations"]
lane = "go-shellui"
may_import = ["go/internal/osboundary"]

[go_package."go/internal/shellui/audittail"]
lane = "go-shellui"
may_import = ["go/internal/osboundary"]

[go_package."go/internal/shellui/agenthealth"]
lane = "go-shellui"
may_import = ["go/internal/osboundary"]

[go_package."go/internal/shellui/theme"]
lane = "go-shellui"
may_import = []

[go_package."go/internal/shellui/widgets"]
lane = "go-shellui"
may_import = []

[go_package."go/internal/shellui/catalog"]
lane = "go-shellui"
may_import = ["go/internal/appcatalog"]

[go_package."go/internal/shellui/catalogroute"]
lane = "go-shellui"
may_import = ["go/internal/shellui/catalog"]

[go_package."go/internal/shellui/surfaces"]
lane = "go-shellui"
may_import = ["go/internal/surfacetrack"]

[go_package."go/internal/shellui/surfaceroute"]
lane = "go-shellui"
may_import = ["go/internal/shellui/surfaces"]

[go_package."go/internal/shellui/server"]
lane = "go-shellui"
may_import = [
  "go/internal/appcatalog",
  "go/internal/nativelaunch",
  "go/internal/session",
  "go/internal/shellui/catalog",
  "go/internal/shellui/catalogroute",
  "go/internal/shellui/staticserve",
  "go/internal/shellui/surfaceroute",
  "go/internal/shellui/surfaces",
  "go/internal/shellui/theme",
]

# Rust lanes

[crate."de-rs/crates/foundation/de-ids"]
lane = "rust-foundation"
may_depend_on = []

[crate."de-rs/crates/foundation/de-error"]
lane = "rust-foundation"
may_depend_on = []

[crate."de-rs/crates/foundation/de-time"]
lane = "rust-foundation"
may_depend_on = []

[crate."de-rs/crates/protocol/protocol-compositor"]
lane = "contract-steward"
may_depend_on = ["de-ids", "de-error"]

[crate."de-rs/crates/protocol/protocol-shell"]
lane = "contract-steward"
may_depend_on = ["de-ids", "de-error"]

[crate."de-rs/crates/protocol/protocol-os-boundary"]
lane = "contract-steward"
may_depend_on = ["de-ids", "de-error", "de-time"]

[crate."de-rs/crates/protocol/protocol-evidence"]
lane = "contract-steward"
may_depend_on = ["de-ids", "de-error", "de-time"]

[crate."de-rs/crates/protocol/protocol-codegen"]
lane = "contract-steward"
may_depend_on = [
  "protocol-compositor",
  "protocol-shell",
  "protocol-os-boundary",
  "protocol-evidence",
]

[crate."de-rs/crates/state/surface-model"]
lane = "rust-state"
may_depend_on = ["de-ids", "de-error", "protocol-compositor"]
may_not_depend_on = ["compositor-backend-api"]

[crate."de-rs/crates/state/launch-model"]
lane = "rust-state"
may_depend_on = ["de-ids", "de-error", "de-time", "protocol-compositor"]
may_not_depend_on = ["compositor-backend-api"]

[crate."de-rs/crates/state/session-model"]
lane = "rust-state"
may_depend_on = ["de-ids", "de-error", "de-time"]
may_not_depend_on = ["compositor-backend-api"]

[crate."de-rs/crates/state/layout-model"]
lane = "rust-state"
may_depend_on = ["de-ids", "de-error", "protocol-shell"]
may_not_depend_on = ["compositor-backend-api"]

[crate."de-rs/crates/state/grant-model"]
lane = "rust-state"
may_depend_on = ["de-ids", "de-error", "de-time", "protocol-os-boundary"]
may_not_depend_on = ["compositor-backend-api"]

[crate."de-rs/crates/services/policy-projection"]
lane = "rust-service"
may_depend_on = ["de-ids", "de-error", "surface-model", "grant-model"]

[crate."de-rs/crates/services/capture-classifier"]
lane = "rust-service"
may_depend_on = ["de-ids", "de-error", "protocol-evidence"]

[crate."de-rs/crates/services/evidence-classifier"]
lane = "rust-service"
may_depend_on = ["de-ids", "de-error", "de-time", "protocol-evidence"]

[crate."de-rs/crates/services/theme-sanitizer"]
lane = "rust-service"
may_depend_on = ["de-error", "protocol-shell"]

[crate."de-rs/crates/compositor/compositor-backend-api"]
lane = "rust-compositor"
may_depend_on = ["de-ids", "de-error", "protocol-compositor", "protocol-evidence"]

[crate."de-rs/crates/compositor/backend-wayfire-protocol"]
lane = "rust-compositor"
may_depend_on = ["de-ids", "de-error", "compositor-backend-api"]

[crate."de-rs/crates/compositor/backend-standard-wayland-probe"]
lane = "rust-compositor"
may_depend_on = ["de-ids", "de-error", "compositor-backend-api"]

[crate."de-rs/crates/compositor/smithay-spike"]
lane = "rust-compositor-spike"
may_depend_on = ["de-ids", "de-error", "compositor-backend-api"]

[crate."de-rs/crates/tools/protocol-dump"]
lane = "rust-tool"
may_depend_on = ["protocol-compositor", "protocol-shell", "protocol-os-boundary", "protocol-evidence"]

[crate."de-rs/crates/tools/evidence-inspect"]
lane = "rust-tool"
may_depend_on = ["protocol-evidence", "evidence-classifier"]

# TypeScript lanes

